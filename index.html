<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>SOREA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      background: #f6f5f2;
      color: #171717;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px 100px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #dedbd5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .hero {
      margin-bottom: 36px;
    }

    .hero h1 {
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: -2px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 17px;
      line-height: 1.45;
      color: #77736d;
      max-width: 340px;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-bottom: 42px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 19px 20px;
      font-size: 17px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .button.primary {
      background: #171717;
      color: white;
    }

    .button.secondary {
      background: white;
      color: #171717;
      border: 1px solid #e4e1db;
    }

    .section-title {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .event-card {
      background: white;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #ebe8e2;
    }

    .event-category {
      font-size: 13px;
      color: #88847d;
      margin-bottom: 8px;
    }

    .event-title {
      font-size: 19px;
      font-weight: 650;
      margin-bottom: 8px;
    }

    .event-info {
      font-size: 14px;
      color: #77736d;
    }

    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 570px;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(20px);
      border: 1px solid #e4e1db;
      border-radius: 22px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .nav-item {
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 15px;
      font-size: 12px;
      color: #77736d;
      cursor: pointer;
    }

    .nav-item.active {
      background: #171717;
      color: white;
    }

    .nav-icon {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">SOREA</div>
      <div class="profile">👤</div>
    </header>

    <main>

      <section class="hero">
        <h1>Лучшие моменты — вместе.</h1>
        <p>
          Найди компанию для отдыха, событий и новых впечатлений.
        </p>
      </section>

      <section class="actions">
        <button class="button primary" onclick="findCompany()">
          Найти компанию →
        </button>

        <button class="button secondary" onclick="createEvent()">
          Создать встречу +
        </button>
      </section>

      <section>
        <h2 class="section-title">Что происходит рядом</h2>

        <div class="event-card">
          <div class="event-category">🏠 Дом · Выходные</div>
          <div class="event-title">Дом за городом на выходные</div>
          <div class="event-info">
            4 места · €35 с человека · 20–30 лет
          </div>
        </div>

        <div class="event-card">
          <div class="event-category">🌲 Природа · Активный отдых</div>
          <div class="event-title">Поход и костёр</div>
          <div class="event-info">
            3 места · бесплатно · завтра
          </div>
        </div>

      </section>

    </main>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">⌂</span>
      Главная
    </button>

    <button class="nav-item">
      <span class="nav-icon">⌕</span>
      Поиск
    </button>

    <button class="nav-item" onclick="createEvent()">
      <span class="nav-icon">＋</span>
      Создать
    </button>

    <button class="nav-item">
      <span class="nav-icon">○</span>
      Профиль
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function findCompany() {
      alert("Здесь будет поиск мероприятий");
    }

    function createEvent() {
      alert("Здесь будет создание встречи");
    }
  </script>

</body>
</html>
